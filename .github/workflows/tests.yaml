name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor and newest
        python-version: ["3.11", "3.14"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          # lowest-direct on the newest interpreter: the torch 2.4 floor has no 3.14 wheels
          - python-version: "3.14"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --resolution ${{ matrix.resolution }}
      # no [build-system] yet, so uv sync does not install the package itself
      - run: uv pip install -e .
      - run: uv run pytest --cov=tems --cov-branch --cov-report=term-missing --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
