[project]
name = "tems"
description = "Translation Equivariant ModelS"
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "William Patton", email = "wllmpttn24@gmail.com" },
]
dynamic = ['version']

requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]
keywords = []

dependencies = ["torch>=2.4"]

[project.urls]
"github" = "https://github.com/pattonw/tems"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tems = ["py.typed", "LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "tems.__version__" }

[dependency-groups]
# Installed by `uv sync` (PEP 735); not part of the published package.
# ruff is pinned with == until uv.lock is committed: it changes its rule
# set between releases.
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff==0.17.3",
    "ty==0.0.96",
    "funlib-persistence>=0.5.0",
]
docs = [
    "funlib-learn-torch",
    "ipykernel>=6.29.5",
    "nbsphinx>=0.9.6",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-material>=0.0.36",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=4.0",
    "jupytext>=1.16.7",
]

[tool.uv.sources]
funlib-learn-torch = { git = "https://github.com/funkelab/funlib.learn.torch" }

[tool.ty.src]
include = ["src", "tests"]
exclude = []  # only ever shrinks

[tool.ty.terminal]
# warn-level rules are recorded counters, not failures
error-on-warning = false

[tool.ty.rules]
# torch.nn.Module declares `forward` as a Callable attribute; overriding it with
# a def trips invalid-mutable-override on every module. Recorded as a warning.
invalid-mutable-override = "warn"

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports
